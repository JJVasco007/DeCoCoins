<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor Futurista</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #0f0f1a, #000);
      color: #00ffe0;
      margin: 0;
      padding: 40px;
      text-align: center;
    }
    h1 {
      font-size: 2.5em;
      text-shadow: 0 0 10px #00ffe0, 0 0 20px #00ffe0;
      margin-bottom: 30px;
    }
    .converter {
      background: rgba(20, 20, 40, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px #00ffe0;
      display: inline-block;
      animation: glow 3s infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 20px #00ffe0; }
      to { box-shadow: 0 0 40px #ff00ff; }
    }
    input, select, button {
      margin: 10px;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      outline: none;
    }
    input, select {
      background: #111;
      color: #00ffe0;
      box-shadow: inset 0 0 10px #00ffe0;
    }
    button {
      background: linear-gradient(90deg, #00ffe0, #ff00ff);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px #ff00ff;
    }
    #result {
      margin-top: 20px;
      font-size: 1.2em;
      text-shadow: 0 0 10px #ff00ff;
    }
  </style>
</head>
<body>
  <h1>💱 Conversor Futurista</h1>
  <div class="converter">
    <input type="number" id="amount" placeholder="Cantidad" value="1">
    <select id="from">
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
      <option value="COP">COP</option>
      <option value="MXN">MXN</option>
    </select>
    <select id="to">
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="COP">COP</option>
      <option value="MXN">MXN</option>
    </select>
    <button onclick="convert()">🚀 Convertir</button>
    <div id="result"></div>
  </div>

  <script>
    async function convert() {
      const amount = document.getElementById('amount').value;
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;

      try {
        const res = await fetch(`https://api.exchangerate.host/latest?base=${from}&symbols=${to}`);
        const data = await res.json();
        const rate = data.rates[to];
        const result = (amount * rate).toFixed(2);
        document.getElementById('result').innerText = `${amount} ${from} = ${result} ${to}`;
      } catch (error) {
        document.getElementById('result').innerText = "⚠️ Error al obtener tasas de cambio.";
      }
    }

    // Service Worker básico
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker registrado"))
        .catch(err => console.error("Error SW:", err));
    }
  </script>
</body>
</html>
