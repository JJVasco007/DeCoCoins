<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tablero de Cambio</title>


  <!-- =====================================================
       ICONO DE LA PÁGINA
  ====================================================== -->

  <link
    rel="icon"
    type="image/png"
    href="icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="icon.png"
  >


  <!-- =====================================================
       MANIFEST PWA
  ====================================================== -->

  <link
    rel="manifest"
    href="manifest.json"
  >


  <!-- =====================================================
       FUENTES
  ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    :root {

      --ink: #11162a;

      --ink-2: #191f38;

      --brass: #c9a227;

      --brass-bright: #e8c34f;

      --parchment: #f3ecdc;

      --teal: #3fae72;

      --rust: #c0453a;

      --line:
        rgba(243, 236, 220, 0.14);
    }


    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:

        radial-gradient(
          circle at 20% -10%,
          #1c2447 0%,
          transparent 55%
        ),

        radial-gradient(
          circle at 85% 110%,
          #1a2340 0%,
          transparent 50%
        ),

        var(--ink);

      color: var(--parchment);

      font-family: 'Inter', sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 32px 18px;
    }


    /* =====================================================
       ENCABEZADO
    ====================================================== */

    .eyebrow {

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size: 11px;

      letter-spacing: .28em;

      text-transform: uppercase;

      color: var(--brass-bright);

      text-align: center;

      margin-bottom: 10px;

      opacity: .85;
    }


    h1 {

      font-family:
        'Playfair Display',
        serif;

      font-style: italic;

      font-weight: 600;

      font-size: 2.1em;

      text-align: center;

      margin: 0 0 28px;

      color: var(--parchment);
    }


    /* =====================================================
       TABLERO
    ====================================================== */

    .board {

      width: 100%;

      max-width: 500px;

      background:
        linear-gradient(
          180deg,
          var(--ink-2),
          #10142a
        );

      border:
        1px solid var(--line);

      border-radius: 6px;

      padding: 28px 26px 22px;

      box-shadow:

        0 30px 60px -20px
        rgba(0, 0, 0, .6),

        inset 0 1px 0
        rgba(255, 255, 255, .03);

      position: relative;
    }


    .board::before {

      content: "";

      position: absolute;

      inset: 10px;

      border:
        1px solid
        rgba(201, 162, 39, .18);

      border-radius: 3px;

      pointer-events: none;
    }


    /* =====================================================
       ETIQUETAS
    ====================================================== */

    .field-label {

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size: 10px;

      letter-spacing: .18em;

      text-transform: uppercase;

      color: #8b90ab;

      margin-bottom: 6px;

      display: block;
    }


    /* =====================================================
       CANTIDAD
    ====================================================== */

    .amount-row {

      margin-bottom: 18px;
    }


    input#amount {

      width: 100%;

      background: #0b0e1e;

      border:
        1px solid var(--line);

      border-radius: 4px;

      color: var(--brass-bright);

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size: 1.6em;

      font-weight: 500;

      padding: 12px 14px;

      letter-spacing: .03em;
    }


    input#amount:focus {

      outline: none;

      border-color: var(--brass);
    }


    /* =====================================================
       DIVISAS
       
       DESDE | ⇄ | HACIA
    ====================================================== */

    .pair-row {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        42px
        minmax(0, 1fr);

      align-items: end;

      gap: 10px;

      margin-bottom: 22px;
    }


    .flap {

      min-width: 0;
    }


    /* =====================================================
       SELECT
    ====================================================== */

    select {

      width: 100%;

      appearance: none;

      background:

        #0b0e1e

        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23c9a227"/></svg>')

        right 14px center no-repeat;

      border:
        1px solid var(--line);

      border-radius: 4px;

      color: var(--parchment);

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size: 1.05em;

      font-weight: 600;

      letter-spacing: .05em;

      padding:
        12px 30px 12px 14px;

      height: 46px;

      cursor: pointer;
    }


    select:focus {

      outline: none;

      border-color: var(--brass);
    }


    select:hover {

      border-color:
        rgba(201, 162, 39, .6);
    }


    /* =====================================================
       BOTÓN INTERCAMBIAR
    ====================================================== */

    .swap-btn {

      width: 42px;

      height: 46px;

      border:
        1px solid var(--line);

      background: #0b0e1e;

      color: var(--brass);

      border-radius: 4px;

      font-size: 18px;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      transition:

        transform .25s ease,

        border-color .2s ease,

        color .2s ease;
    }


    .swap-btn:hover {

      border-color: var(--brass);

      color: var(--brass-bright);

      transform: rotate(180deg);
    }


    .swap-btn:active {

      transform: scale(.95);
    }


    /* =====================================================
       BOTÓN CONVERTIR
    ====================================================== */

    .convert-btn {

      width: 100%;

      background:

        linear-gradient(
          180deg,
          var(--brass-bright),
          var(--brass)
        );

      color: #1a1406;

      border: none;

      border-radius: 4px;

      font-family:
        'Inter',
        sans-serif;

      font-weight: 600;

      font-size: .92em;

      letter-spacing: .1em;

      text-transform: uppercase;

      padding: 14px;

      cursor: pointer;

      box-shadow:

        0 8px 18px -8px
        rgba(201, 162, 39, .6);

      transition:

        filter .15s ease,

        transform .15s ease;
    }


    .convert-btn:hover {

      filter: brightness(1.08);

      transform: translateY(-1px);
    }


    .convert-btn:active {

      transform: translateY(0);
    }


    .convert-btn:disabled {

      opacity: .6;

      cursor: wait;

      transform: none;
    }


    /* =====================================================
       RESULTADO
    ====================================================== */

    .result-wrap {

      margin-top: 24px;

      padding-top: 20px;

      border-top:
        1px dashed
        rgba(201, 162, 39, .3);

      min-height: 80px;
    }


    .result-label {

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size: 10px;

      letter-spacing: .18em;

      text-transform: uppercase;

      color: #8b90ab;

      margin-bottom: 10px;
    }


    .flap-display {

      display: flex;

      flex-wrap: wrap;

      gap: 4px;

      perspective: 400px;
    }


    .flap-tile {

      background: #0b0e1e;

      border:
        1px solid
        rgba(201, 162, 39, .35);

      border-radius: 3px;

      color: var(--teal);

      font-family:
        'IBM Plex Mono',
        monospace;

      font-weight: 600;

      font-size: 1.5em;

      min-width: 28px;

      text-align: center;

      padding: 6px 4px;

      animation:
        flip .45s ease;

      transform-origin: center;
    }


    .flap-tile.unit {

      color: var(--brass-bright);

      font-size: 1.1em;

      align-self: center;

      border: none;

      background: none;

      padding-left: 8px;
    }


    /* =====================================================
       ANIMACIÓN
    ====================================================== */

    @keyframes flip {

      0% {

        transform:
          rotateX(90deg);

        opacity: 0;
      }

      60% {

        transform:
          rotateX(-10deg);

        opacity: 1;
      }

      100% {

        transform:
          rotateX(0deg);
      }
    }


    /* =====================================================
       ERROR
    ====================================================== */

    .error-text {

      color: var(--rust);

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size: .9em;

      line-height: 1.5;
    }


    /* =====================================================
       TICKER
    ====================================================== */

    .ticker {

      max-width: 500px;

      margin-top: 4px;

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size: 14px;

      color: var(--parchment);

      white-space: nowrap;

      overflow: hidden;

      text-align: left;
    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 600px) {

      .board {

        max-width: 100%;

        padding:
          25px 20px 20px;
      }


      .pair-row {

        grid-template-columns: 1fr;
      }


      .swap-btn {

        width: 100%;

        height: 38px;
      }


      .swap-btn:hover {

        transform: none;
      }


      .ticker {

        white-space: normal;

        line-height: 1.6;
      }
    }


    @media (max-width: 420px) {

      body {

        padding:
          25px 12px;
      }


      h1 {

        font-size: 1.8em;
      }


      .eyebrow {

        font-size: 9px;
      }
    }

  </style>

</head>


<body>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <div>


    <!-- ENCABEZADO -->

    <div class="eyebrow">
      Casa de cambio · tasas actualizadas
    </div>


    <h1>
      Tablero de Cambio
    </h1>


    <!-- =================================================
         TABLERO
    ================================================== -->

    <div class="board">


      <!-- CANTIDAD -->

      <div class="amount-row">

        <span class="field-label">
          Cantidad
        </span>


        <input
          type="number"
          id="amount"
          value="1"
          min="0"
          step="any"
          placeholder="Ingrese una cantidad"
        >

      </div>


      <!-- =================================================
           DIVISAS
      ================================================== -->

      <div class="pair-row">


        <!-- DESDE -->

        <div class="flap">

          <span class="field-label">
            Desde
          </span>


          <select id="from">

            <option value="USD">
              USD
            </option>

            <option value="EUR">
              EUR
            </option>

            <option value="COP">
              COP
            </option>

            <option value="MXN">
              MXN
            </option>

            <option value="GBP">
              GBP
            </option>

            <option value="JPY">
              JPY
            </option>

            <option value="BRL">
              BRL
            </option>

            <option value="ARS">
              ARS
            </option>

            <option value="CLP">
              CLP
            </option>

            <option value="PEN">
              PEN
            </option>

            <option value="CAD">
              CAD
            </option>

            <option value="CHF">
              CHF
            </option>

            <option value="CNY">
              CNY
            </option>

            <option value="AUD">
              AUD
            </option>

          </select>

        </div>


        <!-- BOTÓN ⇄ -->

        <button
          class="swap-btn"
          id="swapBtn"
          type="button"
          onclick="swapCurrencies()"
          title="Invertir monedas"
        >
          ⇄
        </button>


        <!-- HACIA -->

        <div class="flap">

          <span class="field-label">
            Hacia
          </span>


          <select id="to">

            <option value="EUR">
              EUR
            </option>

            <option value="USD">
              USD
            </option>

            <option value="COP">
              COP
            </option>

            <option value="MXN">
              MXN
            </option>

            <option value="GBP">
              GBP
            </option>

            <option value="JPY">
              JPY
            </option>

            <option value="BRL">
              BRL
            </option>

            <option value="ARS">
              ARS
            </option>

            <option value="CLP">
              CLP
            </option>

            <option value="PEN">
              PEN
            </option>

            <option value="CAD">
              CAD
            </option>

            <option value="CHF">
              CHF
            </option>

            <option value="CNY">
              CNY
            </option>

            <option value="AUD">
              AUD
            </option>

          </select>

        </div>

      </div>


      <!-- =================================================
           CONVERTIR
      ================================================== -->

      <button
        class="convert-btn"
        id="convertBtn"
        type="button"
        onclick="convert()"
      >
        Convertir
      </button>


      <!-- =================================================
           RESULTADO
      ================================================== -->

      <div class="result-wrap">

        <div class="result-label">
          Resultado
        </div>


        <div
          class="flap-display"
          id="result"
        ></div>

      </div>

    </div>


    <!-- =================================================
         MONEDAS DISPONIBLES
    ================================================== -->

    <div class="ticker">

      USD · EUR · COP · MXN · GBP · JPY · BRL · ARS · CLP · PEN · CAD · CHF · CNY · AUD

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>


    /* =====================================================
       MOSTRAR RESULTADO
    ====================================================== */

    function renderFlaps(text) {

      const container =
        document.getElementById('result');


      container.innerHTML = '';


      [...text].forEach((ch, i) => {

        const tile =
          document.createElement('div');


        const isDigitish =
          /[0-9.,]/.test(ch);


        tile.className =
          'flap-tile' +
          (isDigitish ? '' : ' unit');


        tile.textContent =
          ch;


        tile.style.animationDelay =
          (i * 25) + 'ms';


        container.appendChild(tile);

      });

    }


    /* =====================================================
       MOSTRAR ERROR
    ====================================================== */

    function renderError(message) {

      const container =
        document.getElementById('result');


      container.innerHTML = '';


      const span =
        document.createElement('div');


      span.className =
        'error-text';


      span.textContent =
        message;


      container.appendChild(span);

    }


    /* =====================================================
       INTERCAMBIAR MONEDAS
    ====================================================== */

    function swapCurrencies() {

      const from =
        document.getElementById('from');


      const to =
        document.getElementById('to');


      const temporary =
        from.value;


      from.value =
        to.value;


      to.value =
        temporary;


      /*
       * Limpiar resultado anterior
       */

      document.getElementById(
        'result'
      ).innerHTML = '';

    }


    /* =====================================================
       CONVERTIR MONEDA
    ====================================================== */

    async function convert() {

      const amountInput =
        document.getElementById('amount');


      const from =
        document.getElementById('from').value;


      const to =
        document.getElementById('to').value;


      const button =
        document.getElementById('convertBtn');


      /* -----------------------------------------------
         VALIDAR CANTIDAD
      ------------------------------------------------ */

      const amount =
        Number(amountInput.value);


      if (
        !Number.isFinite(amount) ||
        amount < 0
      ) {

        renderError(
          '⚠️ Introduce una cantidad válida.'
        );

        return;
      }


      /* -----------------------------------------------
         MISMA MONEDA
      ------------------------------------------------ */

      if (from === to) {

        const formatted =
          amount.toLocaleString(
            'es-CO',
            {
              minimumFractionDigits: 2,

              maximumFractionDigits: 2
            }
          );


        renderFlaps(
          `${formatted} ${to}`
        );


        return;
      }


      /* -----------------------------------------------
         CARGANDO
      ------------------------------------------------ */

      button.disabled = true;

      button.textContent =
        'Consultando...';


      renderFlaps('···');


      try {


        /* ---------------------------------------------
           API FRANKFURTER

           No necesita API KEY.
        --------------------------------------------- */

        const url =
          `https://api.frankfurter.dev/v2/rate/${from}/${to}`;


        const response =
          await fetch(url);


        /* ---------------------------------------------
           COMPROBAR RESPUESTA
        --------------------------------------------- */

        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        /* ---------------------------------------------
           COMPROBAR TASA
        --------------------------------------------- */

        if (
          !data ||
          typeof data.rate !== 'number'
        ) {

          throw new Error(
            'Tasa no disponible'
          );

        }


        /* ---------------------------------------------
           CALCULAR
        --------------------------------------------- */

        const rate =
          data.rate;


        const result =
          amount * rate;


        /* ---------------------------------------------
           FORMATEAR
        --------------------------------------------- */

        const formatted =
          result.toLocaleString(
            'es-CO',
            {
              minimumFractionDigits: 2,

              maximumFractionDigits: 2
            }
          );


        /* ---------------------------------------------
           MOSTRAR RESULTADO
        --------------------------------------------- */

        renderFlaps(
          `${formatted} ${to}`
        );


      } catch (error) {

        console.error(
          'Error de conversión:',
          error
        );


        renderError(
          '⚠️ No se pudo obtener la tasa de cambio.'
        );

      } finally {

        button.disabled = false;

        button.textContent =
          'Convertir';

      }

    }


    /* =====================================================
       ENTER PARA CONVERTIR
    ====================================================== */

    document
      .getElementById('amount')
      .addEventListener(
        'keydown',
        function(event) {

          if (
            event.key === 'Enter'
          ) {

            convert();

          }

        }
      );


    /* =====================================================
       SERVICE WORKER
    ====================================================== */

    if (
      'serviceWorker' in navigator
    ) {

      navigator.serviceWorker
        .register('sw.js')

        .then(() => {

          console.log(
            'Service Worker registrado correctamente.'
          );

        })

        .catch(error => {

          console.error(
            'Error registrando Service Worker:',
            error
          );

        });

    }

  </script>

</body>

</html>
